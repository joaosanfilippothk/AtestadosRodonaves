<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#342EFF">
<title>Rodonaves · Atestados e dias perdidos</title>
<style>
/* Identidade Rodonaves: azul #342EFF e laranja #FF9D3B (tokens do site rodonaves.com.br); fonte GT Walsheim quando instalada.
   Modo "tela única": a área do painel tem 810 px de altura (como no template) e é escalada para caber na janela, sem rolagem. */
:root{
  color-scheme:light;
  --brand:#342EFF;--brand-d:#2A24D9;--brand-soft:#EAE7FF;--brand-light:#D4E7FC;
  --orange:#FF9D3B;--navy:#081B30;
  --page:#F3F4F6;--surface:#FFFFFF;--ink:#111827;--ink2:#374151;--muted:#5B6471;--tick:#9CA3AF;
  --grid:#E5E7EB;--axis:#D1D5DB;--border:#E5E7EB;--wash:rgba(52,46,255,.07);
  --good:#0D7248;--bad:#E61E32;
  --warn-bg:#FEEECF;--warn-ink:#663504;
  --heat0:#EAE7FF;--heat1:#342EFF;
  --shadow:0 3px 9px rgba(17,24,39,.22);
  --font:"GT Walsheim","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:13px/1.4 var(--font)}
body.app:not(.free){overflow:hidden;height:100vh}
h1,h2,h3,p,ul{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.side :focus-visible,.topbar :focus-visible,.dr-h :focus-visible,.gate :focus-visible{outline-color:var(--orange)}
.muted{color:var(--muted)}.small{font-size:12px}.strong{font-weight:700}.c{text-align:center}
.ico{flex:none}
.clk{cursor:pointer}

/* ---- tela única ---- */
#root{position:relative}
body.app:not(.free) #root{position:fixed;inset:0;overflow:hidden}
.stage{position:relative}
body.app:not(.free) .stage{position:absolute;left:0;top:0;transform-origin:0 0}
.shell{display:grid;grid-template-columns:205px minmax(0,1fr);height:100%;min-height:100vh}
body.app:not(.free) .shell{min-height:0}
.side{background:var(--brand);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
body.app:not(.free) .side{position:relative;height:100%}
.side-logo{padding:30px 22px 8px;display:flex;justify-content:center}
.side-logo img{width:150px;height:auto;display:block}
.menu{display:flex;flex-direction:column;margin-top:20px}
.mi{display:flex;align-items:center;justify-content:space-between;gap:10px;height:54px;padding:0 20px;background:none;border:0;color:#fff;font-size:15px;text-align:left;width:100%}
.mi:hover{background:rgba(255,255,255,.1)}
.mi[aria-current=page]{background:rgba(255,255,255,.2);font-weight:700}
.upd{margin-top:auto;padding:14px 14px 18px;text-align:center;font-weight:700;font-size:13px;line-height:1.5}
.upd hr{border:0;border-top:2px solid rgba(255,255,255,.85);margin:0 8px 12px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.topbar{flex:none;background:var(--brand);color:#fff;height:78px;display:flex;align-items:center;gap:16px;padding:0 22px}
.tb-l{flex:0 1 auto;min-width:0}
.topbar h1{font-size:26px;font-weight:700;line-height:1.15;white-space:nowrap}
.tb-sub{font-size:11.5px;opacity:.92;margin-top:2px;white-space:nowrap}
.tb-sub .linklike{color:#fff}
.tb-sel{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-height:60px;overflow:hidden}
.sel-l{font-size:12px;font-weight:700;opacity:.9}
.xchip{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--brand);border:0;border-radius:999px;padding:3px 8px 3px 10px;font-size:12px;font-weight:600;max-width:260px}
.xchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xchip:hover{background:var(--brand-soft)}
.xmore{font-size:12px;font-weight:700;opacity:.9}
.xclear{color:#fff!important;font-size:12px}
.tb-r{flex:0 0 auto;display:flex;align-items:flex-end;gap:10px;margin-left:auto}
.unit{display:flex;flex-direction:column;gap:3px;margin-right:6px}
.unit-l{font-weight:700;font-size:14px}
.ib{position:relative;width:36px;height:36px;display:grid;place-items:center;background:transparent;border:1px solid rgba(255,255,255,.5);border-radius:8px;color:#fff;padding:0}
.ib:hover{background:rgba(255,255,255,.18)}
.ib-badge{position:absolute;top:-7px;right:-7px;background:var(--orange);color:var(--ink);border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.page{flex:1;min-height:0;padding:14px 18px;display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;height:28px;background:var(--brand)}
.linklike{background:none;border:0;padding:0;color:var(--brand);text-decoration:underline;font:inherit}
.pg{flex:1;min-height:0;display:grid;gap:12px}
.pg>*{min-width:0;min-height:0}

/* ---- cartões ---- */
.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px 12px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ch{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px;min-height:28px;flex:none}
.ct{flex:1 1 auto;text-align:center;color:var(--brand);font-size:17px;font-weight:700;line-height:1.2;min-width:120px}
.ch .ctl{flex:0 1 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ch:has(.ctl) .ct{text-align:left}
.sub{color:var(--muted);font-size:11.5px;flex:none;margin:1px 0 2px;line-height:1.3}
.cb{flex:1;min-height:0;position:relative;margin-top:4px}
.note{flex:none;color:var(--muted);font-size:11.5px;margin-top:4px;text-align:center}
.note.c{margin:0 0 8px}
.empty{color:var(--muted);padding:22px;text-align:center}
.chartbox{position:absolute;inset:0;overflow:hidden}
.chartbox>svg{display:block}
.legend{flex:none;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:2px 0;font-size:12px;color:var(--ink2)}
.lg{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 6px;border-radius:999px}
.lg i{width:11px;height:11px;border-radius:50%;display:inline-block}
.lg.clk:hover{background:var(--brand-soft)}
.lg.on{background:var(--brand-soft);font-weight:700}
.lg.dim{opacity:.45}

/* ---- KPIs ---- */
.kpis{display:flex;flex-wrap:nowrap;gap:12px;flex:none}
.kpi{flex:0 0 250px;height:132px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:12px 12px;text-align:center;min-width:0;display:flex;flex-direction:column;justify-content:center}
.kpi-l{color:var(--brand);font-size:19px;font-weight:700;line-height:1.15}
.kpi-v{color:var(--brand);font-size:52px;font-weight:700;line-height:1.1;margin-top:2px}
.kpi-s{color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.25}
.kpis.fit .kpi{flex:1 1 0;height:92px;padding:8px 10px}
.kpis.fit .kpi-l{font-size:14.5px}
.kpis.fit .kpi-v{font-size:32px;margin-top:0}
.kpis.fit .kpi-s{font-size:11px}

/* ---- composição de cada página (cabe em uma tela) ---- */
.pg-var{grid-template-rows:auto minmax(0,1fr)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;min-height:0}
.pg-dist{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.pg-dist .c-sexfx{grid-column:1;grid-row:1}.pg-dist .c-sem{grid-column:1;grid-row:2}.pg-dist .c-sec{grid-column:2;grid-row:1/3}
.pg-func{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.pg-med{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.pg-med .c-emisTab{grid-column:1/3}
.pg-cid{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.pg-ben,.pg-msg{grid-template-columns:minmax(0,1fr)}
.pg-reinc{grid-template-rows:auto auto minmax(0,.8fr) minmax(0,1.2fr)}
.pg-reinc .mid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-height:0}
.pg-reinc .mid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.strip{flex-direction:row;align-items:center;justify-content:flex-start;gap:8px 24px;padding:8px 14px;flex-wrap:wrap}
.strip .sub{margin:0;text-align:left;flex:1 1 280px}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:12.5px}
.pg-dados{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto auto;gap:12px;align-content:start;overflow:auto}
.pg-dados .card{overflow:visible;min-height:auto;padding:8px 14px 10px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s4{grid-column:span 4}
.card>.ct{flex:none}
.pg-dados .ct{text-align:center}
.pg-dados .drop{padding:16px;margin-top:8px}
.pg-dados .kv li{padding:4px 0}
.pg-dados .checks{gap:6px;margin:8px 0 8px}
.pg-dados .checks li,.pg-dados .note{font-size:12px}
.pg-dados .row{margin-top:8px}
.defs-l{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-height:64vh;overflow:auto}

/* ---- controles ---- */
h3{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.seg{display:inline-flex;border:1.5px solid var(--brand);border-radius:999px;overflow:hidden}
.seg button{background:#fff;border:0;padding:3px 12px;font-size:12px;font-weight:600;color:var(--brand)}
.seg button+button{border-left:1.5px solid var(--brand)}
.seg button.on{background:var(--brand);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);padding:6px 13px;border-radius:8px;font-weight:600;font-size:13px;line-height:1.2}
.btn:hover{background:var(--brand-soft)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.cta{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.btn.cta:hover{filter:brightness(.95);background:var(--orange)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger:hover{filter:brightness(.92);background:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.sm{padding:2px 9px;font-size:12px}
.btn.big{padding:12px 16px;font-size:15px}
.fld{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.fld.col{flex-direction:column;align-items:stretch;gap:4px}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=number],select{background:#fff;border:1px solid #C4C9D1;border-radius:6px;padding:4px 8px;font-size:12.5px;color:var(--ink);min-width:0}
input[type=checkbox]{accent-color:var(--brand)}
input.big{padding:12px;font-size:15px;width:100%}
.chip{display:flex;width:100%;align-items:center;gap:8px;border:1px solid #C4C9D1;background:#fff;border-radius:8px;padding:8px 12px;font-size:13px;color:var(--ink2);text-align:left}
.chip b{margin-left:auto;color:var(--brand)}
.chip.on{border-color:var(--brand)}
.ms{position:relative}
.ms.inl{margin-bottom:8px}
.ms-panel{position:absolute;z-index:60;top:calc(100% + 6px);left:0;min-width:260px;max-width:min(360px,92vw);background:#fff;color:var(--ink);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(17,24,39,.25);padding:8px}
.ms-panel.inline{position:static;box-shadow:none;max-width:none;margin-top:6px}
.ms-panel input[type=search]{width:100%}
.ms-list{max-height:240px;overflow:auto;margin:6px 0}
.ms-o{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer}
.ms-o:hover{background:var(--brand-soft)}
.ms-o span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-o small{color:var(--muted)}
.ms-more{padding:6px;font-size:12px}
.ms-foot{display:flex;justify-content:space-between}
.unit-btn{width:clamp(150px,18vw,290px);height:30px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;color:var(--ink2);border:0;border-radius:4px;padding:0 10px;font-size:13px}
.unit-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- painel de filtros ---- */
.drawer{position:absolute;inset:0;z-index:150}
body.free .drawer{position:fixed}
.dr-ov{position:absolute;inset:0;background:rgba(8,27,48,.45)}
.dr-pane{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25);outline:none}
.dr-h{background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.dr-h h2{font-size:19px}
.dr-b{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:18px}
.dr-sec h3{color:var(--brand);font-size:13px;margin-bottom:8px}
.dr-sec .row{margin-top:8px}
.dr-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

/* ---- gráficos ---- */
.ax{fill:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.ax.sm{font-size:10px}
.ax.selx{fill:var(--brand);font-weight:700}
.xl.clk{cursor:pointer}
.xl.clk:hover{fill:var(--brand)}
.vl{fill:var(--ink);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.vl.halo{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.vl.dim,.dim .bt{opacity:.45}
.gl{stroke:var(--grid);stroke-width:1}
.bl{stroke:var(--axis);stroke-width:1}
.hl{fill:var(--wash)}
.selband{fill:var(--brand);fill-opacity:.1}
.hit{fill:transparent;outline:none}
.hit.clk{cursor:pointer}
.hit:focus-visible{fill:var(--wash);stroke:var(--brand);stroke-width:2}
path.dim{opacity:.3}
g.dim{opacity:.4}
.hov .bg:not(.on) path{opacity:.5}
.xh{stroke:#9CA3AF;stroke-width:1}
.ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.mk{stroke:#fff;stroke-width:2}
.bt{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.hb{display:flex;flex-direction:column}
.hb-r{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:10px;align-items:center;padding:0 6px;border-radius:6px}
.hb-r:hover,.hb-r:focus-visible{background:var(--brand-soft)}
.hb-r.on{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
.hb-r.dim .hb-f{opacity:.3}
.hb-r.dim .hb-l,.hb-r.dim .hb-v{opacity:.55}
.hb-l{min-width:0;display:flex;flex-direction:column;line-height:1.2;font-size:12.5px}
.hb-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-l small{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:13px}
.hb-f{height:100%;background:var(--brand);border-radius:0 4px 4px 0;min-width:2px}
.hb-v{font-variant-numeric:tabular-nums;min-width:70px;text-align:right;font-weight:700;font-size:12.5px}
.scale{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2);height:24px;justify-content:center}
.grad{width:150px;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--heat0),var(--heat1));display:inline-block}

/* ---- tabelas (cabem na altura; o excedente vira página) ---- */
.tbl{display:flex;flex-direction:column;height:100%;min-height:0}
.tbar{display:flex;gap:10px;align-items:center;height:34px;flex:none}
.tsearch{flex:1;min-width:120px;max-width:260px}
.tinfo{font-size:12px}
.tscroll{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;border:1px solid var(--grid);border-radius:8px}
.tscroll.tight table{font-size:11.5px}
.tscroll.tight th,.tscroll.tight td{padding:0 6px}
.tpg{flex:none;height:30px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:0 9px;text-align:left;white-space:nowrap}
tbody tr,tfoot tr{height:var(--rh,25px)}
thead th{background:var(--brand);color:#fff;font-weight:700;font-size:12px;height:30px}
th button{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:700;display:inline-flex;gap:4px;align-items:center}
.arr{font-size:9px}
.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:var(--page)}
tbody tr:hover{background:var(--brand-soft)}
tbody tr.clk{cursor:pointer}
tbody tr.on,tbody tr.on:nth-child(even){background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand);font-weight:700}
tbody tr.dim td{opacity:.5}
tbody th{font-weight:700;text-align:left}
tfoot td,tfoot th{font-weight:700;background:var(--brand-soft)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);height:30px;flex:none}
.plain{height:100%}
.plain .tscroll{border:0;border-radius:0}
.plain thead th{height:26px;font-size:12.5px}
.plain tbody tr{height:var(--rh,24px)}
.plain td:first-child{font-weight:700}
.var{white-space:nowrap}
.arw{width:15px;height:15px;vertical-align:-2px;margin-right:6px}
.arw.up{fill:var(--good)}.arw.down{fill:var(--bad)}
table.heat th,table.heat td{padding:0 6px}
.heat thead th{white-space:normal;vertical-align:bottom;min-width:44px;height:44px;padding-bottom:4px}
.heat thead th.clk{cursor:pointer}
.heat thead th.on{box-shadow:inset 0 -3px 0 var(--orange)}
.heat thead th:first-child{min-width:150px}
.heat td.hc{text-align:center;min-width:44px;font-variant-numeric:tabular-nums;font-weight:600}
.heat td.hc.clk{cursor:pointer}
.heat td.hc.on{outline:2px solid var(--ink);outline-offset:-2px}
.heat td.hc.dim{opacity:.35}
.heat td.zero{color:var(--tick);text-align:center}
.heat th.rowh{background:#fff;text-align:left;font-weight:600;color:var(--ink);max-width:210px;overflow:hidden;text-overflow:ellipsis}
.heat th.rowh.clk{cursor:pointer}
.heat th.rowh.on{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
.heat tbody tr:nth-child(even) th.rowh{background:var(--page)}
.heat tr.dim th.rowh,.heat tr.dim td:not(.hc){opacity:.5}
.heat tfoot th.rowh{background:var(--brand-soft)}

/* ---- Dados, segurança, formulários ---- */
.drop{border:2px dashed var(--brand);border-radius:12px;padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;margin-top:12px;color:var(--brand);background:var(--wash)}
.drop:hover,.drop:focus-visible{background:var(--brand-soft)}
.drop .muted{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:center}
.tag{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--page);color:var(--ink2);font-family:ui-monospace,Consolas,monospace}
.tag.req{background:var(--brand-soft);color:var(--brand);font-weight:700}
.tag.opt{font-style:italic}
.kv{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column}
.kv li{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid var(--grid)}
.kv li:last-child{border-bottom:0}
.warnnum{color:var(--warn-ink)}
.warn{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-ink);padding:10px 12px;border-radius:8px;font-size:13px}
.form-err{color:var(--bad);min-height:1.3em;font-size:13px}
.checks{list-style:none;padding:0;margin:10px 0 14px;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks .ico{color:var(--good);margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.row.end{justify-content:flex-end;margin-top:0}
details.defs summary{cursor:pointer;font-weight:700;font-size:16px;color:var(--brand)}
.defs ul{margin:12px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.gate{min-height:100vh;background:var(--brand);display:grid;place-items:center;padding:16px}
.gate-card{width:100%;max-width:440px;background:#fff;border-radius:16px;padding:30px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(8,27,48,.4);font-size:14px}
.gate-logo{width:210px;height:auto;align-self:flex-start;margin-bottom:6px}
.gate-card h1{font-size:22px;color:var(--ink)}
.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:4px}
.meter{display:flex;gap:4px}
.meter i{flex:1;height:5px;border-radius:3px;background:var(--grid)}
.meter.lv1 i:nth-child(-n+1){background:var(--bad)}
.meter.lv2 i:nth-child(-n+2){background:#F9AB10}
.meter.lv3 i:nth-child(-n+3),.meter.lv4 i{background:var(--good)}

/* ---- camadas ---- */
.tip{position:fixed;z-index:200;pointer-events:none;background:#fff;color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:8px 10px;box-shadow:0 6px 24px rgba(17,24,39,.25);font-size:12.5px;min-width:130px;max-width:320px}
.tip-t{color:var(--ink2);margin-bottom:4px;font-weight:700}
.tip-r{display:flex;align-items:center;gap:8px;line-height:1.55}
.tip-r i{width:12px;height:3px;border-radius:2px;flex:none}
.tip-r b{font-weight:700;font-variant-numeric:tabular-nums}
.tip-r span{color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;max-width:min(92vw,540px);z-index:400}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad)}
.busy{position:fixed;inset:0;z-index:500;background:rgba(8,27,48,.5);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:#fff;font-weight:600}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid rgba(255,255,255,.35);border-top-color:var(--orange);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dlg{border:0;border-radius:14px;padding:0;background:#fff;color:var(--ink);width:min(520px,94vw);box-shadow:0 20px 60px rgba(8,27,48,.45);font-size:14px}
.dlg.wide{width:min(640px,94vw)}
.dlg::backdrop{background:rgba(8,27,48,.55)}
.dlg h2{padding:18px 20px 0;font-size:18px;color:var(--brand)}
.dlg-body{padding:12px 20px;display:flex;flex-direction:column;gap:10px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:10px 20px 18px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}.toast{transition:none}}

/* ---- modo livre (celular ou janela muito pequena): colunas empilhadas, com rolagem ---- */
body.free .shell{grid-template-columns:minmax(0,1fr);height:auto}
body.free .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;overflow:visible}
body.free .side-logo{padding:14px 16px}
body.free .side-logo img{width:130px}
body.free .menu{flex-direction:row;overflow-x:auto;margin:0;width:100%;order:3;background:rgba(0,0,0,.12)}
body.free .mi{height:46px;width:auto;white-space:nowrap;padding:0 14px;flex:none}
body.free .upd{display:none}
body.free .main{height:auto}
body.free .topbar{height:auto;min-height:78px;padding:12px 16px;flex-wrap:wrap}
body.free .topbar h1{font-size:24px}
body.free .tb-sel{flex:1 1 100%;order:3}
body.free .tb-r{margin-left:0;flex:1 1 100%;min-width:0;flex-wrap:wrap}
body.free .tb-sub{white-space:normal}
body.free .page{padding:16px;overflow:visible}
body.free .pg{display:flex;flex-direction:column}
body.free .pg>*{min-height:auto}
body.free .row2,body.free .pg-reinc .mid{display:flex;flex-direction:column}
body.free .kpis{flex-wrap:wrap}
body.free .kpi,body.free .kpis.fit .kpi{flex:1 1 100%;height:auto;min-height:90px}
body.free .kpi-v{font-size:42px}
body.free .card{overflow:visible}
body.free .cb{min-height:0}
body.free .chartbox:not(.auto){position:relative;inset:auto;height:290px}
body.free .chartbox.auto{position:relative;inset:auto;height:auto;overflow:visible}
body.free .tbl{height:auto}
body.free .tscroll{overflow-x:auto}
body.free .hb-r{grid-template-columns:1fr auto}
body.free .hb-t{grid-column:1/-1}
body.free .pg-dados{display:grid}
body.free .s4,body.free .s8{grid-column:span 12}

@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
  .noprint,.side,.tip,.toast,.busy,.drawer,.bar,.pager,.tbar .btn,.seg,.fld,.ib,.tpg{display:none!important}
  .shell{display:block}
  .topbar{background:#fff;color:var(--ink);padding:0 0 10px;height:auto}
  .tb-sub{color:var(--muted)}
  .tb-sub .linklike{display:none}
  .page{padding:0}
  .card,.kpi{box-shadow:none;border:1px solid var(--border);break-inside:avoid}
}

</style>
</head>

async function readZip(buf) {

function decodeText(buf) {

  const first = text.slice(0, 8000).split(/\r?\n/).find(l => l.trim()) || '';

  let inq = false;
  for (const ch of first) { if (ch === '"') inq = !inq; else if (!inq && ch in cnt) cnt[ch]++; }
  const d = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
  const rows = [];
  let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }

function findHeader(rows) {

const str = v => v == null ? '' : typeof v === 'number' ? String(Number.isInteger(v) ? v : +v.toFixed(6)) : typeof v === 'boolean' ? '' : String(v).replace(/\s+/g, ' ').trim();

    const di = parseDate(get(r, 'DTINICIO'));
    if (!di) { st.semData++; continue; }
    const df = parseDate(get(r, 'DTFINAL'));

    const hd = findHeader(rows);
    if (!best || hd.count > best.hd.count) best = { rows, hd, name: wb.sheets[i].name };
    if (hd.count >= 10) break;

async function analyzeFile(file) {
  const buf = await file.arrayBuffer();
  const b = new Uint8Array(buf, 0, Math.min(8, buf.byteLength));
  let rows, sheet;
  if (b[0] === 0xD0 && b[1] === 0xCF) throw new Error('Este arquivo está no formato antigo (.xls) ou protegido por senha. No Excel, abra-o e use Arquivo > Salvar como > Pasta de Trabalho do Excel (.xlsx), sem senha, e importe de novo.');
  await tick();
  if (b[0] === 0x50 && b[1] === 0x4B) {
    const wb = await readXlsx(buf);
    const best = await pickSheet(wb);
    rows = best.rows; sheet = best.name;

  const missing = Object.keys(ALIASES).filter(f => !(f in hd.idx) && f !== 'DTENTREGA');
  const base = { file: file.name, size: file.size, sheet, headers, found, missing, hd };
  if (hd.i < 0 || REQUIRED.some(f => !(f in hd.idx))) return { ...base, fatal: true, records: [], stats: null };

  const { records, stats } = toRecords(rows, hd);
  let mn = '9999', mx = '0000';
  for (const r of records) { if (r.di < mn) mn = r.di; if (r.di > mx) mx = r.di; }

function monotonePath(pts) {
  const n = pts.length;
  if (n === 1) return `M${pts[0][0]},${pts[0][1]}`;
  const dx = [], m = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = (pts[i + 1][1] - pts[i][1]) / dx[i]; }
  const t = new Array(n);
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) { // curva monotônica: não "passa" do valor entre dois pontos
    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < n - 1; i++) {
    const hh = dx[i] / 3;
    d += `C${pts[i][0] + hh},${pts[i][1] + t[i] * hh} ${pts[i + 1][0] - hh},${pts[i + 1][1] - t[i + 1] * hh} ${pts[i + 1][0]},${pts[i + 1][1]}`;

function sexFxData(F, Fall) { // Fall define as categorias (todas continuam no eixo, mesmo sem atestados na seleção); F traz os valores

function heatScale() {
  const cs = getComputedStyle(document.documentElement);
  const rgb = x => { const n = parseInt(x.trim().slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  const a = rgb(cs.getPropertyValue('--heat0')), b = rgb(cs.getPropertyValue('--heat1'));
  const lum = c => c.reduce((s, v, i) => { v /= 255; return s + (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4) * [0.2126, 0.7152, 0.0722][i]; }, 0);
  return t => {
    const c = a.map((v, i) => Math.round(v + (b[i] - v) * t)), L = lum(c);
    return { bg: `rgb(${c[0]},${c[1]},${c[2]})`, fg: (L + 0.05) / 0.0592 >= 1.05 / (L + 0.05) ? '#111827' : '#ffffff' };
  };
}
// Matriz função × CID: as colunas se ajustam à largura e as linhas à altura (o resto vira página ‹ ›); célula, linha e coluna são clicáveis.
function heatBox(F) {
  const m = mOf('heat'), val = r => m === 'n' ? 1 : r.dias;
  const cidTot = new Map(), funTot = new Map(), cell = new Map();
  for (const r of F) {
    const f = r.fun || NI, v = val(r), c = r.cid ? r.cg : NC;
    funTot.set(f, (funTot.get(f) || 0) + v);
    if (r.cid) cidTot.set(c, (cidTot.get(c) || 0) + v);
    const k = f + '\u0001' + c;
    cell.set(k, (cell.get(k) || 0) + v);
  }
  const cids = [...cidTot].sort((a, b) => b[1] - a[1]), funs = [...funTot].sort((a, b) => b[1] - a[1]);
  const get = (f, c) => cell.get(f + '\u0001' + c) || 0;
  const totAll = [...funTot.values()].reduce((s, v) => s + v, 0);
  const anyF = xAny('fun'), anyC = xAny('cg'), any = anyF || anyC;
  return chartBox((box, W, H) => {
    const free = H === Infinity;
    const nCols = Math.max(2, Math.min(14, Math.floor((W - 190 - 3 * 62) / 50)));
    const topC = cids.slice(0, nCols).map(x => x[0]), rest = cids.slice(nCols).map(x => x[0]);
    const RH = 25, HEAD = 44, FOOT = 27, PAG = 30, SCALE = 24;
    const room = free ? Infinity : H - SCALE - HEAD - FOOT - 4;
    let per = free ? 15 : Math.max(2, Math.floor(room / RH));
    if (funs.length > per && !free) per = Math.max(2, Math.floor((room - PAG) / RH));
    const pages = Math.max(1, Math.ceil(funs.length / per));
    const rowsN = Math.min(per, funs.length) + 1; // + linha de total
    const rh = free ? RH : Math.max(RH, Math.min(36, Math.floor((H - SCALE - HEAD - 6 - (pages > 1 ? PAG : 0)) / rowsN))); // sobrou altura: linhas mais folgadas
    let max = 0;
    for (const [f] of funs) for (const c of topC) max = Math.max(max, get(f, c));
    const color = heatScale(), sumRest = f => rest.reduce((s, c) => s + get(f, c), 0);
    const paint = () => {
      const pg = Math.max(0, Math.min(U.pg.heat || 0, pages - 1)), slice = funs.slice(pg * per, pg * per + per);
      const thead = h('thead', null, h('tr', null, h('th', null, 'Função'),
        topC.map(c => h('th', { class: 'num clk' + (xHas('cg', c) ? ' on' : ''), title: cidSub(c) || c, onclick: e => xPick({ cg: c }, addKey(e)) }, c)),
        h('th', { class: 'num' }, 'Outros'), h('th', { class: 'num' }, 'Sem CID'), h('th', { class: 'num' }, 'Total')));
      const body = slice.map(([f, tot]) => h('tr', { class: any && anyF && !xHas('fun', f) ? 'dim' : '' },
        h('th', { class: 'rowh clk' + (xHas('fun', f) ? ' on' : ''), title: f, onclick: e => xPick({ fun: f }, addKey(e)) }, f),
        topC.map(c => {
          const v = get(f, c), ok = (!anyF || xHas('fun', f)) && (!anyC || xHas('cg', c));
          if (!v) return h('td', { class: 'hc zero' }, '·');
          const col = color(max ? v / max : 0);
          return h('td', { class: 'hc clk' + (any && ok ? ' on' : '') + (any && !ok ? ' dim' : ''), style: `background:${col.bg};color:${col.fg}`, title: `${f} · ${c}: ${fInt(v)}`,
            onclick: e => xPick({ fun: f, cg: c }, addKey(e)) }, fInt(v));
        }),
        h('td', { class: 'num' }, fInt(sumRest(f))), h('td', { class: 'num' }, fInt(get(f, NC))), h('td', { class: 'num strong' }, fInt(tot))));
      const foot = h('tfoot', null, h('tr', null, h('th', { class: 'rowh' }, 'Total'),
        topC.map(c => h('td', { class: 'num' }, fInt(cidTot.get(c) || 0))),
        h('td', { class: 'num' }, fInt(rest.reduce((s, c) => s + (cidTot.get(c) || 0), 0))),
        h('td', { class: 'num' }, fInt([...funTot.keys()].reduce((s, f) => s + get(f, NC), 0))), h('td', { class: 'num strong' }, fInt(totAll))));
      put(box,
        h('div', { class: 'scale', 'aria-label': 'Escala de cor' }, h('span', null, '0'), h('i', { class: 'grad' }), h('span', null, fInt(max))),
        h('div', { class: 'tscroll' }, h('table', { class: 'heat', style: `--rh:${rh}px` }, thead, h('tbody', null, body), foot)),
        pages > 1 ? h('div', { class: 'tpg' }, pagerEl(pg, pages, p => { U.pg.heat = p; tipHide(); paint(); })) : null);
    };
    paint();
  }, { auto: true });
}

const DW0 = 1000, DH0 = 810;
function fit() {
  const vw = innerWidth, vh = innerHeight, app = document.body.classList.contains('app');
  const free = !app || vw < 900 || vh < 560; // celular/janela muito pequena: layout em coluna, com rolagem

  U.fv++;
  pruneSel();
  refreshHeader(); refreshBody();
  if (elDrawer && !elDrawer.hidden) drawerRefresh();
}
function onSelChange() { tipHide(); if (S.view === 'app') { refreshHeader(); refreshBody(); } }

/* ---------- painel de filtros (ícone de controles no topo) ---------- */
function openDrawer() { renderDrawer(); elDrawer.hidden = false; const c = elDrawer.querySelector('.dr-pane'); if (c) c.focus(); }
function closeDrawer() { if (elDrawer) { closeMs(); elDrawer.hidden = true; } }
function drawerRefresh() { const x = elDrawer.querySelector('.dr-clear'); if (x) x.disabled = !filtersActive(); const s = elDrawer.querySelector('.dr-count'); if (s) s.textContent = `${fInt(getF().length)} atestados no filtro`; }
function renderDrawer() {
  const years = [...new Set(S.records.map(r => r.di.slice(0, 4)))].sort().reverse();
  const presets = [{ v: 'all', t: 'Todo o período' }, { v: 'm3', t: 'Últimos 3 meses' }, { v: 'm6', t: 'Últimos 6 meses' }, { v: 'm12', t: 'Últimos 12 meses' },
    ...years.map(y => ({ v: 'y' + y, t: 'Ano ' + y })), { v: 'custom', t: 'Personalizado' }];
  const setRange = (a, b, p) => { U.from = a; U.to = b; U.preset = p; onFilterChange(); renderDrawer(); };
  put(elDrawer,
    h('div', { class: 'dr-ov', onclick: closeDrawer }),
    h('aside', { class: 'dr-pane', role: 'dialog', 'aria-label': 'Filtros', tabindex: -1 },
      h('div', { class: 'dr-h' }, h('h2', null, 'Filtros'), h('button', { type: 'button', class: 'ib', 'aria-label': 'Fechar filtros', onclick: closeDrawer }, icon('x', 20))),
      h('div', { class: 'dr-b' },
        h('div', { class: 'dr-sec' }, h('h3', null, 'Período (início do atestado)'),
          selectCtl('', presets, U.preset, v => { const [a, b] = presetRange(v); setRange(a, b, v); }),
          h('div', { class: 'row' },
            h('label', { class: 'fld' }, h('span', null, 'De'), h('input', { type: 'date', value: U.from, onchange: e => setRange(e.target.value, U.to, 'custom') })),
            h('label', { class: 'fld' }, h('span', null, 'Até'), h('input', { type: 'date', value: U.to, onchange: e => setRange(U.from, e.target.value, 'custom') })))),
        h('div', { class: 'dr-sec' }, h('h3', null, 'Dimensões'),
          DRAWER_DIMS.filter(d => dimOptions(d.k).length > 1).map(d => multiSelect(d, onFilterChange, { inline: true }))),
        h('div', { class: 'dr-sec' }, h('h3', null, 'CID'), selectCtl('Agrupar por', Object.entries(LVL).map(([v, t]) => ({ v, t })), U.cidLevel, v => { setCidLevel(v); onFilterChange(); }))),
      h('div', { class: 'dr-f' }, h('span', { class: 'dr-count' }),
        h('button', { type: 'button', class: 'btn dr-clear', onclick: () => { clearFilters(); onFilterChange(); renderDrawer(); } }, icon('x', 14), 'Limpar filtros'))));
  drawerRefresh();
}

/* ---------- bloqueio ---------- */
function lock(reason) {
  closeMs(); tipHide();
  document.querySelectorAll('dialog').forEach(d => d.dispatchEvent(new Event('cancel', { cancelable: true })));
  S.key = null; S.salt = null; S.records = []; S.meta = { imports: [] }; S.min = ''; S.max = ''; S.dv++;
  U.f = {}; U.fv++; U.x = {}; U.xv++; U.pg = {}; U.t = {}; dropFilterCache();
  S.view = 'login';
  renderGate();
  if (reason === 'idle') toast('Bloqueado por inatividade.');
}
function afterUnlock() {
  clearInterval(gateTimer);
  S.view = 'app'; U.f = {}; U.x = {}; U.xv++; applyDefaultPeriod(); U.fv++; touch();
  renderApp();
}

/* ---------- tela de senha ---------- */
function pwProblem(p) {
  if (p.length < 10) return 'Use pelo menos 10 caracteres.';
  if (new Set(p).size < 5) return 'Senha repetitiva demais. Misture mais caracteres.';
  return '';
}
function pwScore(p) {
  let s = 0;
  if (p.length >= 10) s++;
  if (p.length >= 14) s++;
  if ((/[a-z]/.test(p) ? 1 : 0) + (/[A-Z]/.test(p) ? 1 : 0) + (/\d/.test(p) ? 1 : 0) + (/[^A-Za-z0-9]/.test(p) ? 1 : 0) >= 3) s++;
  if (p.length >= 18 || new Set(p).size >= 14) s++;
  return s;
}
function toGate() { document.body.classList.remove('app', 'free'); elStage = null; }
function fatal(text) {
  toGate();
  put($('#root'), h('div', { class: 'gate' }, h('div', { class: 'gate-card' }, h('img', { class: 'gate-logo', src: LOGO_BLUE, alt: 'Rodonaves' }), h('h1', null, 'Não foi possível abrir o painel'), h('p', null, text))));
}
function renderGate() {
  closeMs(); tipHide(); clearInterval(gateTimer); toGate();
  const setup = S.view === 'setup';
  const msg = h('p', { class: 'form-err', role: 'alert' });
  const pw = h('input', { type: 'password', class: 'big', autocomplete: setup ? 'new-password' : 'current-password', placeholder: setup ? 'Crie uma senha' : 'Senha', 'aria-label': 'Senha' });
  const pw2 = setup ? h('input', { type: 'password', class: 'big', autocomplete: 'new-password', placeholder: 'Repita a senha', 'aria-label': 'Repita a senha' }) : null;
  const meter = setup ? h('div', { class: 'meter', 'aria-hidden': 'true' }, h('i'), h('i'), h('i'), h('i')) : null;
  const hint = 'Mínimo de 10 caracteres. Uma frase com várias palavras funciona bem.';
  const mlabel = setup ? h('span', { class: 'muted small' }, hint) : null;
  const show = h('button', { type: 'button', class: 'btn ghost sm', 'aria-label': 'Mostrar ou ocultar a senha', onclick: () => { const t = pw.type === 'password' ? 'text' : 'password'; pw.type = t; if (pw2) pw2.type = t; } }, icon('eye', 16), 'Mostrar');
  const go = h('button', { type: 'button', class: 'btn cta big', onclick: submit }, setup ? 'Criar senha e entrar' : 'Entrar');
  if (setup) pw.addEventListener('input', () => {
    const s = pw.value ? Math.max(1, pwScore(pw.value)) : 0;
    meter.className = 'meter lv' + s;
    mlabel.textContent = pw.value ? ['', 'Fraca', 'Razoável', 'Boa', 'Forte'][s] + (pw.value.length < 10 ? ' · faltam ' + (10 - pw.value.length) + ' caracteres' : '') : hint;
  });
  for (const el of [pw, pw2]) if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  async function submit() {
    msg.textContent = '';
    if (setup) {
      const pr = pwProblem(pw.value);
      if (pr) { msg.textContent = pr; return; }
      if (pw.value !== pw2.value) { msg.textContent = 'As senhas não conferem.'; return; }
      busy('Criando o cofre criptografado…'); await tick();
      try { await createVault(pw.value); pw.value = ''; pw2.value = ''; afterUnlock(); }
      catch (e) { msg.textContent = e.message === 'CONFLICT' ? 'Já existe um cofre neste navegador. Recarregue a página.' : 'Não consegui criar o cofre: ' + e.message; }
      finally { busy(); }
      return;
    }
    if (failInfo().until > Date.now() || !pw.value) return;
    busy('Abrindo…'); await tick();
    try { await unlockVault(pw.value); failClear(); pw.value = ''; afterUnlock(); }
    catch (e) {
      if (e.message === 'BAD_PASSWORD') {
        const f = failRecord();
        msg.textContent = 'Senha incorreta.';
        if (f.until > Date.now()) countdown(); else pw.select();
      } else msg.textContent = e.message === 'CORRUPT' ? 'Os dados salvos estão corrompidos. Restaure um backup.' : 'Erro ao abrir: ' + e.message;
    } finally { busy(); }
  }
  function countdown() {
    clearInterval(gateTimer);
    const step = () => {
      const left = Math.ceil((failInfo().until - Date.now()) / 1000);
      if (left > 0) { msg.textContent = `Muitas tentativas. Aguarde ${left}s para tentar de novo.`; go.disabled = true; }
      else { clearInterval(gateTimer); msg.textContent = ''; go.disabled = false; }
    };
    step(); gateTimer = setInterval(step, 1000);
  }
  put($('#root'), h('div', { class: 'gate' }, h('div', { class: 'gate-card' },
    h('img', { class: 'gate-logo', src: LOGO_BLUE, alt: 'Rodonaves' }),
    h('h1', null, setup ? 'Proteja os dados com uma senha' : 'Atestados e dias perdidos'),
    h('p', { class: 'muted' }, setup
      ? 'Os dados importados ficam salvos só neste navegador, criptografados (AES-256) com a sua senha. Sem ela, ninguém lê o conteúdo.'
      : 'Digite a senha para abrir os dados salvos neste navegador.'),
    pw, pw2, meter, mlabel, h('div', { class: 'row end' }, show), msg, go,
    setup ? h('p', { class: 'warn' }, icon('alert', 16), 'Não existe recuperação de senha. Se esquecer, será preciso apagar os dados salvos e importar a planilha de novo.') : null,
    h('div', { class: 'links' },
      h('button', { type: 'button', class: 'linklike', onclick: () => { $('#bkfile').value = ''; $('#bkfile').click(); } }, setup ? 'Já tenho um backup' : 'Restaurar de um backup'),
      setup ? null : h('button', { type: 'button', class: 'linklike', onclick: () => wipeFlow(false) }, 'Esqueci a senha')))));
  if (!setup && failInfo().until > Date.now()) countdown();
  pw.focus();
}

/* ---------- fluxos de dados ---------- */
async function saveError(e) {
  const conflict = e && e.message === 'CONFLICT';
  await modal({
    title: conflict ? 'Dados alterados em outra aba' : 'Não foi possível salvar',
    body: h('p', null, conflict
      ? 'Outra aba ou janela deste painel salvou dados depois que esta foi aberta. Para não sobrescrever nada, a alteração não foi gravada. Bloqueie e entre de novo para carregar a versão mais recente.'
      : 'Erro ao gravar no armazenamento do navegador: ' + ((e && e.message) || e) + '. A alteração não foi salva.'),
    actions: [{ label: conflict ? 'Bloquear e recarregar' : 'Fechar', value: true, kind: 'primary' }],
  });
  if (conflict) lock('manual'); else render();
}
function render() { if (S.view === 'app') renderApp(); else renderGate(); }
async function importFlow(file) {
  busy('Lendo a planilha…'); await tick();
  let an;
  try { an = await analyzeFile(file); }
  catch (e) {
    busy();
    await modal({ title: 'Não consegui ler o arquivo', body: h('p', null, e.message || String(e)), actions: [{ label: 'Fechar', value: true, kind: 'primary' }] });
    return;
  }
  busy();
  if (an.fatal || !an.stats.validas) {
    const body = an.fatal
      ? [h('p', null, 'Não encontrei as colunas obrigatórias (CHAPA e DTINICIO) em nenhuma aba.'), h('p', { class: 'sub' }, 'Colunas lidas: ' + (an.headers.slice(0, 30).join(', ') || 'nenhuma'))]
      : [h('p', null, `Nenhuma linha válida: ${fInt(an.stats.lidas)} linhas lidas; ${fInt(an.stats.semChapa)} sem CHAPA e ${fInt(an.stats.semData)} sem DTINICIO válida.`)];
    await modal({ title: 'Nada para importar', body, actions: [{ label: 'Fechar', value: true, kind: 'primary' }] });
    return;
  }
  const st = an.stats, has = S.records.length > 0;
  const li = (t, v, cls) => h('li', null, h('span', null, t), h('b', { class: cls || '' }, v));
  const choice = await modal({
    title: 'Conferir antes de importar', wide: true,
    body: [
      h('p', { class: 'sub' }, `${an.file} · aba "${an.sheet}"`),
      h('ul', { class: 'kv' },
        li('Linhas lidas', fInt(st.lidas)), li('Atestados válidos', fInt(st.validas)), li('Período (DTINICIO)', `${fData(an.min)} a ${fData(an.max)}`),
        st.semChapa ? li('Ignoradas: sem CHAPA', fInt(st.semChapa), 'warnnum') : null,
        st.semData ? li('Ignoradas: DTINICIO inválida', fInt(st.semData), 'warnnum') : null,
        st.dups ? li('Linhas duplicadas ignoradas', fInt(st.dups), 'warnnum') : null,
        st.diasCalc ? li('QTD_DIAS vazia (calculada pelas datas)', fInt(st.diasCalc)) : null,
        st.diasAberto ? li('Sem QTD_DIAS e sem DTFINAL (dias = 0)', fInt(st.diasAberto), 'warnnum') : null,
        st.fimAntes ? li('DTFINAL anterior ao início', fInt(st.fimAntes), 'warnnum') : null),
      an.missing.length ? h('p', { class: 'warn' }, icon('alert', 16), `Colunas não encontradas: ${an.missing.join(', ')}. Os indicadores que dependem delas ficarão vazios.`) : null,
      has ? h('p', null, `Já existem ${fInt(S.records.length)} atestados salvos (${fData(S.min)} a ${fData(S.max)}). Como deseja importar?`) : null,
      has ? h('p', { class: 'sub' }, 'Se esta planilha traz todo o histórico, escolha "Substituir tudo". "Somar" serve para planilhas só com período novo; registros corrigidos na origem entrariam como novos.') : null,
    ],
    actions: has
      ? [{ label: 'Cancelar', value: null }, { label: 'Somar aos dados atuais (ignora repetidos)', value: 'merge' }, { label: 'Substituir tudo', value: 'replace', kind: 'primary' }]
      : [{ label: 'Cancelar', value: null }, { label: 'Importar', value: 'replace', kind: 'primary' }],
  });
  if (!choice) return;
  busy('Salvando com criptografia…'); await tick();
  const prev = { records: S.records, meta: S.meta };
  let added = st.validas, skipped = 0, recs = an.records;
  if (choice === 'merge') { const mg = mergeRecords(S.records, an.records); recs = mg.records; added = mg.add; skipped = mg.skip; }
  S.records = recs;
  S.meta = { ...S.meta, imports: [...(S.meta.imports || []), { at: new Date().toISOString(), file: an.file, mode: choice, lidas: st.lidas, validas: st.validas, add: added, dup: st.dups + skipped }].slice(-40) };
  prepareAll();
  try { await saveVault(); }
  catch (e) { S.records = prev.records; S.meta = prev.meta; prepareAll(); busy(); await saveError(e); return; }
  busy();
  clearFilters();
  if (!prev.records.length) U.tab = 'var';
  renderApp();
  toast(`${fInt(added)} atestados ${choice === 'merge' ? 'adicionados' : 'importados'}.`, 'ok');
}
async function exportBackup() {
  busy('Gerando o backup…'); await tick();
  try {
    const blob = await makeBackup();
    const d = new Date(), p2 = n => String(n).padStart(2, '0');
    download(`atestados-backup-${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}.htkbak`, blob, 'application/octet-stream');
    markBackup(); refreshHeader();
    toast('Backup salvo. Ele só abre com a senha usada agora.', 'ok');
    if (U.tab === 'dados') refreshBody();
  } catch (e) { toast('Falha ao gerar o backup: ' + e.message, 'err'); }
  finally { busy(); }
}
async function restoreFlow(file) {
  let res = null;
  const err = h('p', { class: 'form-err', role: 'alert' });
  const pw = h('input', { type: 'password', autocomplete: 'off', 'aria-label': 'Senha do backup' });
  const ok = await modal({
    title: 'Restaurar backup',
    body: [h('p', { class: 'sub' }, file.name), h('label', { class: 'fld col' }, h('span', null, 'Senha usada ao criar o backup'), pw), err],
    actions: [{ label: 'Cancelar', value: false }, {
      label: 'Abrir backup', value: true, kind: 'primary',
      check: async () => {
        err.textContent = '';
        if (!pw.value) { err.textContent = 'Digite a senha.'; return false; }
        busy('Abrindo o backup…'); await tick();
        try { res = await readBackup(file, pw.value); return true; }
        catch (e) { err.textContent = e.message === 'BAD_PASSWORD' ? 'Senha incorreta para este backup.' : e.message === 'NOT_BACKUP' ? 'Este arquivo não é um backup deste painel.' : 'O backup está corrompido.'; return false; }
        finally { busy(); }
      },
    }],
  });
  if (!ok || !res) return;
  const rows = res.payload.rows ? res.payload.rows.length : 0;
  const has = S.view === 'app' ? S.records.length > 0 : !!(await vaultGet());
  if (has) {
    const go = await modal({
      title: 'Substituir os dados atuais?',
      body: h('p', null, `O backup tem ${fInt(rows)} atestados e vai substituir os dados salvos neste navegador${S.view === 'app' ? ` (${fInt(S.records.length)} atestados)` : ''}. Isso não pode ser desfeito.`),
      actions: [{ label: 'Cancelar', value: false }, { label: 'Substituir', value: true, kind: 'danger' }],
    });
    if (!go) return;
  }
  busy('Restaurando…'); await tick();
  const prev = { records: S.records, meta: S.meta };
  try {
    unpackInto(res.payload);
    if (S.key) await saveVault();
    else { const cur = await vaultGet(); S.rev = cur ? cur.rev : 0; await saveVault({ key: res.key, salt: res.salt, iter: res.iter }); }
  } catch (e) { S.records = prev.records; S.meta = prev.meta; prepareAll(); busy(); await saveError(e); return; }
  busy();
  clearFilters();
  if (S.view !== 'app') afterUnlock(); else renderApp();
  toast(`Backup restaurado: ${fInt(S.records.length)} atestados.`, 'ok');
}
async function changePwFlow() {
  const cur = h('input', { type: 'password', autocomplete: 'current-password' });
  const nw = h('input', { type: 'password', autocomplete: 'new-password' });
  const nw2 = h('input', { type: 'password', autocomplete: 'new-password' });
  const err = h('p', { class: 'form-err', role: 'alert' });
  const ok = await modal({
    title: 'Alterar senha',
    body: [h('label', { class: 'fld col' }, h('span', null, 'Senha atual'), cur),
      h('label', { class: 'fld col' }, h('span', null, 'Nova senha (mínimo de 10 caracteres)'), nw),
      h('label', { class: 'fld col' }, h('span', null, 'Repita a nova senha'), nw2), err,
      h('p', { class: 'note' }, 'Backups feitos antes continuam abrindo apenas com a senha antiga.')],
    actions: [{ label: 'Cancelar', value: false }, {
      label: 'Alterar senha', value: true, kind: 'primary',
      check: async () => {
        err.textContent = '';
        if (!cur.value) { err.textContent = 'Digite a senha atual.'; return false; }
        const pr = pwProblem(nw.value);
        if (pr) { err.textContent = pr; return false; }
        if (nw.value !== nw2.value) { err.textContent = 'As senhas novas não conferem.'; return false; }
        busy('Re-criptografando os dados…'); await tick();
        try { await changePassword(cur.value, nw.value); return true; }
        catch (e) { err.textContent = e.message === 'BAD_PASSWORD' ? 'A senha atual está incorreta.' : e.message === 'CONFLICT' ? 'Os dados mudaram em outra aba. Bloqueie e entre de novo.' : 'Erro: ' + e.message; return false; }
        finally { busy(); }
      },
    }],
  });
  if (ok) toast('Senha alterada.', 'ok');
}
async function wipeFlow(fromApp) {
  const t = h('input', { type: 'text', autocomplete: 'off', placeholder: 'APAGAR', 'aria-label': 'Digite APAGAR para confirmar' });
  const err = h('p', { class: 'form-err', role: 'alert' });
  const ok = await modal({
    title: 'Apagar todos os dados salvos?',
    body: [h('p', null, 'Isso remove os atestados salvos neste navegador e a senha. Não dá para desfazer. A sua planilha original não é afetada e pode ser importada de novo.'),
      h('p', null, 'Para confirmar, digite APAGAR:'), t, err],
    actions: [{ label: 'Cancelar', value: false }, {
      label: 'Apagar tudo', value: true, kind: 'danger',
      check: async () => { if (t.value.trim().toUpperCase() === 'APAGAR') return true; err.textContent = 'Digite APAGAR para confirmar.'; return false; },
    }],
  });
  if (!ok) return;
  busy('Apagando…'); await tick();
  try { await wipeAll(); } catch (e) { busy(); toast('Não consegui apagar: ' + e.message, 'err'); return; }
  busy();
  S.key = null; S.salt = null; S.records = []; S.meta = { imports: [] }; S.rev = 0; prepareAll();
  U.f = {}; U.fv++;
  S.view = 'setup'; renderGate();
  toast('Dados apagados. Crie uma nova senha para recomeçar.');
}


/* ===== inicialização ===== */
addEventListener('error', e => {
  if (/ResizeObserver loop/.test(e.message || '')) { e.stopImmediatePropagation(); return; } // aviso inofensivo do navegador
  toast('Erro inesperado: ' + (e.message || 'veja o console'), 'err');
});
addEventListener('unhandledrejection', e => toast('Erro inesperado: ' + ((e.reason && e.reason.message) || e.reason), 'err'));
['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart'].forEach(ev => addEventListener(ev, touch, { passive: true }));
const idleCheck = () => { if (S.key && Date.now() - lastAct > U.lockMin * 60000) lock('idle'); };
setInterval(idleCheck, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) idleCheck(); });
document.addEventListener('click', closeMs);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (openMs) closeMs();
  else if (elDrawer && !elDrawer.hidden) closeDrawer();
  else if (S.view === 'app' && xCount() && !document.querySelector('dialog[open]')) xClear(); // Esc limpa a seleção por clique
});
let _wasFree = false;
addEventListener('resize', debounce(() => { if (S.view !== 'app') return; _wasFree = freeMode(); fit(); if (freeMode() !== _wasFree) refreshBody(); }, 60));
addEventListener('beforeprint', () => { if (S.view === 'app') { document.body.classList.add('free', 'printing'); if (elStage) elStage.style.cssText = ''; refreshBody(); } });
addEventListener('afterprint', () => { if (S.view === 'app') { document.body.classList.remove('printing'); fit(); refreshBody(); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files[0]; if (f && S.view === 'app') importFlow(f); });
$('#file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f && S.view === 'app') importFlow(f); });
$('#bkfile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f && S.view !== 'boot') restoreFlow(f); });

async function boot() {
  loadPrefs(); tipInit();
  if (!(window.crypto && crypto.subtle && window.indexedDB && 'CompressionStream' in window && 'DecompressionStream' in window)) {
    return fatal('Este navegador é antigo demais para o painel. Use uma versão recente do Edge ou do Chrome.');
  }
  let rec;
  try { rec = await vaultGet(); }
  catch { return fatal('Não consegui acessar o armazenamento do navegador. Verifique se a navegação anônima ou o bloqueio de dados do site está ativo.'); }
  S.view = rec ? 'login' : 'setup';
  renderGate();
}
boot();

</script>
